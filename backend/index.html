<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Feed Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #f9a8d4; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
                🚦 Traffic Feed Stream
            </h1>
            <p class="text-gray-400 mt-2">Connected to <code class="text-sm bg-gray-800 px-2 py-1 rounded">ws://localhost:8000/ws/traffic</code></p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Latest Message Card -->
            <div class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-white flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                    Live Data
                </h2>
                <pre id="latest-data" class="bg-gray-900 p-4 rounded-lg overflow-x-auto text-sm h-96 font-mono"></pre>
            </div>

            <!-- Connection Log Card -->
            <div class="bg-gray-800 rounded-xl p-6 shadow-lg border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-white">Event Log</h2>
                <div id="event-log" class="space-y-2 h-96 overflow-y-auto text-sm font-mono p-2">
                    <!-- Logs will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const output = document.getElementById('latest-data');
        const log = document.getElementById('event-log');
        const wsUrl = `ws://${window.location.host}/ws/traffic`;

        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="text-gray-500">[${time}]</span> <span class="${type === 'error' ? 'text-red-400' : 'text-gray-300'}">${msg}</span>`;
            log.prepend(div);
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-boolean'; // null
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function connect() {
            addLog("Connecting...", 'info');
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addLog("Connected", 'info');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    output.innerHTML = syntaxHighlight(data);
                    addLog(`Received message type: ${data.type || 'unknown'}`, 'info');
                } catch (e) {
                    output.textContent = event.data;
                    addLog("Received raw text", 'info');
                }
            };

            ws.onclose = () => {
                addLog("Disconnected. Retrying in 3s...", 'error');
                setTimeout(connect, 3000);
            };

            ws.onerror = (err) => {
                addLog("Error occurred", 'error');
                console.error(err);
            };
        }

        connect();
    </script>
</body>
</html>
